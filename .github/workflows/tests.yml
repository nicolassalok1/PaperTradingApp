name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches runtime.txt (python-3.11)

      - name: Install test stack (runtime + pytest, NO torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: MVC import-matrix gate
        run: python scripts/check_mvc_integrity.py

      - name: Secret scan (tracked files)
        run: python scripts/scan_secrets.py

      - name: Unit + smoke tests (network blocked) + coverage floor
        # --disable-socket comes from pyproject addopts; proves the app imports
        # and boots offline WITHOUT the optional runtime-ml (torch) stack.
        # --cov enforces the progressive fail_under floor from pyproject.
        run: python -m pytest -m "unit or smoke" --cov=app -ra
